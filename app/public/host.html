<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LightningClass · 主持人台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- ===========================================================
         Host login
         =========================================================== -->
    <section id="view-login" class="host-login">
      <div class="host-login-card">
        <div class="mascot">🎩</div>
        <h1 class="entry-title">主持人台</h1>
        <p class="entry-subtitle">输入主持人令牌进入控制台</p>

        <div style="text-align:left">
          <label class="label" for="token">主持人令牌</label>
          <input id="token" class="input" type="text" placeholder="启动服务时打印在控制台" autocomplete="off" />
        </div>

        <button id="btn-login" class="btn btn-primary btn-lg btn-block mt-16">进入控制台</button>

        <p id="login-error" class="text-sm" style="color:var(--coral-deep);margin-top:12px;display:none">
          令牌错误
        </p>

        <p style="font-size:12px;color:var(--ink-mute);margin-top:16px;line-height:1.6">
          启动 Node 服务时会在终端打印<br/>
          <code>主持人令牌: XXXXXX</code>
        </p>
      </div>
    </section>

    <!-- ===========================================================
         Host dashboard
         =========================================================== -->
    <section id="view-dashboard" class="hidden">
      <header class="topbar">
        <div class="topbar-brand">
          <div class="logo">🎩</div>
          <span>主持人台</span>
        </div>
        <div class="topbar-stats">
          <span id="status-pill" class="host-state-pill locked">候场</span>
          <button id="btn-reset" class="btn btn-ghost btn-sm">⟲ 重置全场</button>
        </div>
      </header>

      <div class="host-layout">
        <!-- 主区 -->
        <div class="host-main">
          <!-- 当前节点卡片 -->
          <div class="host-current-card">
            <!-- 候场时 -->
            <div id="host-lobby" class="center">
              <div class="mascot">💎</div>
              <h2 style="margin:12px 0">候场中</h2>
              <p class="text-mute">在线学员 <strong id="lobby-online">0</strong> 人 · 准备好就开课</p>
              <button id="btn-start" class="btn btn-primary btn-lg mt-24">🚀 开始培训</button>
            </div>

            <!-- 节点进行时 -->
            <div id="host-node" class="hidden">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
                <div id="hn-icon" style="font-size:36px;width:56px;height:56px;background:var(--paper-deep);display:grid;place-items:center;border-radius:16px">🤖</div>
                <div style="flex:1">
                  <div id="hn-phase" class="node-phase-tag">破冰阶段</div>
                  <div id="hn-title" class="node-title">节点标题</div>
                </div>
                <span id="hn-state" class="host-state-pill locked">LOCKED</span>
              </div>

              <div id="hn-question" class="node-question"></div>

              <div class="host-stats-grid">
                <div class="host-stat">
                  <div class="host-stat-num" id="hn-online">0</div>
                  <div class="host-stat-label">在线</div>
                </div>
                <div class="host-stat">
                  <div class="host-stat-num" id="hn-submitted">0</div>
                  <div class="host-stat-label">已提交</div>
                </div>
                <div class="host-stat">
                  <div class="host-stat-num" id="hn-votes">0</div>
                  <div class="host-stat-label">投票数</div>
                </div>
                <div class="host-stat">
                  <div class="host-stat-num" id="hn-countdown">--:--</div>
                  <div class="host-stat-label">剩余</div>
                </div>
              </div>

              <div class="host-action-row" id="host-actions">
                <!-- buttons injected by JS based on FSM state -->
              </div>
            </div>

            <!-- 颁奖典礼时 -->
            <div id="host-finale" class="hidden center">
              <div class="mascot">🎉</div>
              <h2 style="margin:12px 0">颁奖典礼进行中</h2>
              <p class="text-mute">学员端正在播放颁奖动画</p>
              <button id="btn-finish" class="btn btn-warn mt-16">结束培训</button>
            </div>
          </div>

          <!-- 实时提交流 -->
          <div>
            <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;padding:0 4px">
              <h3 style="font-size:14px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px">📡 实时提交流</h3>
              <span class="text-mute text-sm" id="host-feed-count">0 份 · 时间倒排</span>
            </div>
            <div id="host-sub-feed" class="host-sub-feed">
              <p class="text-mute text-sm center">提交开放后这里会实时显示…</p>
            </div>
          </div>
        </div>

        <!-- 侧边栏 -->
        <aside class="host-side">
          <!-- 排行榜 -->
          <div class="leaderboard">
            <h3>🏆 实时排行榜</h3>
            <div id="leaderboard-list">
              <p class="text-mute text-sm center" style="padding:16px">等学员加入…</p>
            </div>
          </div>

          <!-- 节点地图 -->
          <div class="card">
            <h3 style="font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">📍 节点地图</h3>
            <div id="host-node-map" class="node-map" style="grid-template-columns:repeat(5,1fr);gap:6px;padding:0;border:none"></div>
          </div>

          <!-- 速查小卡 -->
          <div class="card-soft">
            <h3 style="font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">💡 主持小贴士</h3>
            <p id="host-tip" class="text-sm" style="line-height:1.7">
              开课前问候 60 秒，介绍 LightningClass，然后点「开始培训」。
            </p>
          </div>
        </aside>
      </div>
    </section>

    <div id="toast-stack" class="toast-stack"></div>
  </div>

  <script src="/host.js"></script>
</body>
</html>
