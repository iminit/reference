<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF7A59" />
  <title>LightningClass · AI 实践通关</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />

  <!-- Import map maps bare-specifier imports ('preact', 'htm/preact', etc.) to local vendored ES modules. -->
  <script type="importmap">
    {
      "imports": {
        "preact":               "/vendor/preact.mjs",
        "preact/hooks":         "/vendor/preact-hooks.mjs",
        "@preact/signals":      "/vendor/preact-signals.mjs",
        "@preact/signals-core": "/vendor/preact-signals-core.mjs",
        "htm":                  "/vendor/htm.mjs",
        "htm/preact":           "/vendor/htm-preact.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">
      LightningClass 需要 JavaScript。请使用现代浏览器（Chrome / Safari / Edge / Firefox）。
    </p>
  </noscript>

  <script type="module" src="/app.js"></script>
</body>
</html>
